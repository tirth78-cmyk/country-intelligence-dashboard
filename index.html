<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Intelligence Library — Study Start-Up</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ef;
  --surface: #ffffff;
  --surface2: #faf9f6;
  --text: #1a1a1a;
  --text2: #5a5a5a;
  --text3: #8a8a8a;
  --border: #e5e2dc;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --accent2: #4a6fa5;
  --accent2-light: #e6edf5;
  --amber: #b8860b;
  --amber-light: #fef7e6;
  --coral: #c85a3a;
  --coral-light: #fef0eb;
  --purple: #6b5b95;
  --purple-light: #f0edf5;
  --teal: #2d7d6b;
  --teal-light: #e6f3f0;
  --red: #a33;
  --red-light: #fce8e8;
  --font: 'DM Sans', -apple-system, sans-serif;
  --serif: 'Source Serif 4', Georgia, serif;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; }
::selection { background: var(--accent-light); }

.app { min-height: 100vh; }

/* Top nav */
.topnav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
  align-items: center;
  height: 56px;
  gap: 24px;
  position: sticky; top: 0; z-index: 100;
}
.topnav-brand {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  letter-spacing: -0.3px;
}
.topnav-brand span { color: var(--text3); font-weight: 400; font-family: var(--font); font-size: 13px; margin-left: 8px; }
.topnav-tabs {
  display: flex;
  gap: 2px;
  margin-left: auto;
}
.topnav-tab {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  background: none;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.topnav-tab:hover { background: var(--surface2); color: var(--text); }
.topnav-tab.active { background: var(--accent); color: #fff; }

/* Toolbar */
.toolbar {
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.toolbar-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); }
select, .search-input {
  font-family: var(--font);
  font-size: 13px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
select:focus, .search-input:focus { border-color: var(--accent); }
select { cursor: pointer; min-width: 160px; }
.search-input { width: 220px; }

/* Main content */
.main { padding: 0 32px 48px; }

/* ====== VIEW 1: Country Deep-Dive ====== */
.country-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding: 20px 24px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}
.country-flag {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.country-name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.country-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }

.summary-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
.summary-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px 18px;
  border: 1px solid var(--border);
}
.summary-card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 4px; }
.summary-card-value { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.summary-card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.category-section {
  margin-bottom: 20px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
}
.category-header {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  gap: 10px;
  transition: background 0.1s;
}
.category-header:hover { background: var(--surface2); }
.cat-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.cat-title { font-size: 14px; font-weight: 600; flex: 1; }
.cat-count { font-size: 12px; color: var(--text3); background: var(--surface2); padding: 2px 8px; border-radius: 10px; }
.cat-chevron { font-size: 13px; color: var(--text3); transition: transform 0.2s; }
.cat-chevron.open { transform: rotate(90deg); }

.qa-list { padding: 0 20px 16px; }
.qa-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.qa-item:last-child { border-bottom: none; }
.qa-question { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.qa-answer { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.6; }

.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  margin-right: 4px;
}
.tag-yes { background: var(--accent-light); color: var(--accent); }
.tag-no { background: var(--coral-light); color: var(--coral); }
.tag-info { background: var(--accent2-light); color: var(--accent2); }
.tag-warn { background: var(--amber-light); color: var(--amber); }
.tag-purple { background: var(--purple-light); color: var(--purple); }

/* ====== VIEW 2: Cross-Country Comparison ====== */
.comparison-grid {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 24px;
}
.comp-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  min-width: 900px;
}
.comp-table th, .comp-table td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.comp-table thead th {
  background: var(--surface);
  font-weight: 600;
  font-size: 12px;
  color: var(--text2);
  position: sticky; top: 56px; z-index: 10;
  border-bottom: 2px solid var(--border);
}
.comp-table thead th:first-child {
  position: sticky; left: 0; z-index: 11;
  background: var(--surface);
  min-width: 240px;
}
.comp-table tbody td:first-child {
  position: sticky; left: 0;
  background: var(--surface);
  font-weight: 500;
  min-width: 240px;
  z-index: 5;
}
.comp-table tbody tr { background: var(--surface); }
.comp-table tbody tr:hover { background: var(--surface2); }
.comp-table tbody tr.cat-row {
  background: var(--surface2);
}
.comp-table tbody tr.cat-row td {
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  padding: 14px;
  border-bottom: 2px solid var(--border);
}
.cell-yes { color: var(--accent); font-weight: 600; }
.cell-no { color: var(--coral); font-weight: 600; }
.cell-timeline { color: var(--amber); font-weight: 600; }

/* ====== VIEW 3: Insights Heat Map ====== */
.heatmap-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 24px;
  margin-bottom: 24px;
  overflow-x: auto;
}
.heatmap-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.heatmap-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 20px; }

.heatmap-grid {
  display: grid;
  gap: 3px;
  min-width: 700px;
}
.hm-cell {
  padding: 8px 10px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 500;
  text-align: center;
  transition: transform 0.1s;
  cursor: default;
  line-height: 1.3;
}
.hm-cell:hover { transform: scale(1.04); }
.hm-header { font-weight: 700; font-size: 12px; background: none !important; color: var(--text2); }
.hm-row-header { text-align: left; font-weight: 600; font-size: 12px; color: var(--text); display: flex; align-items: center; }

.hm-green { background: #d4edda; color: #155724; }
.hm-yellow { background: #fff3cd; color: #856404; }
.hm-red { background: #f8d7da; color: #721c24; }
.hm-blue { background: #d1ecf1; color: #0c5460; }
.hm-gray { background: #e9ecef; color: #495057; }

.insight-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.insight-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 20px;
}
.insight-card-icon { font-size: 22px; margin-bottom: 8px; }
.insight-card-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.insight-card-body { font-size: 13px; color: var(--text2); line-height: 1.6; }
.insight-card-body strong { color: var(--text); font-weight: 600; }

.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 16px;
  font-size: 12px;
  color: var(--text2);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 14px; height: 14px; border-radius: 3px; }

/* Empty states */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}
.empty-state-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state-text { font-size: 15px; }

/* Responsive */
@media (max-width: 768px) {
  .topnav, .toolbar, .main { padding-left: 16px; padding-right: 16px; }
  .summary-cards { grid-template-columns: repeat(2, 1fr); }
  .country-header { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

// ======= HELPER FUNCTIONS =======

function getAnswerTag(answer) {
  const lower = answer.toLowerCase();
  if (lower.startsWith('yes') || lower.includes('accepted') || lower.includes('permitted') || lower.includes('approved')) return 'yes';
  if (lower.startsWith('no') || lower.includes('prohibited') || lower.includes('not required') || lower.includes('not standard')) return 'no';
  return null;
}

function getAllQuestions() {
  const qs = [];
  CATEGORIES.forEach(cat => {
    cat.subcategories.forEach(sub => {
      sub.questions.forEach(q => qs.push({ ...q, category: cat.title, subcategory: sub.name, catId: cat.id }));
    });
  });
  return qs;
}

function setState(updates) {
  Object.assign(state, updates);
  render();

// ======= RENDER =======

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopNav()}
    ${renderToolbar()}
    <div class="main">
      ${state.view === 'country' ? renderCountryView() : ''}
      ${state.view === 'comparison' ? renderComparisonView() : ''}
      ${state.view === 'insights' ? renderInsightsView() : ''}
      ${state.view === 'analysis' ? renderAnalysisView() : ''}
    </div>
  `;
  bindEvents();
}

function renderTopNav() {
  return `
    <div class="topnav">
      <div class="topnav-brand">Country Intelligence Library <span>Study Start-Up</span></div>
      <div class="topnav-tabs">
        <button class="topnav-tab ${state.view==='country'?'active':''}" data-view="country">Country deep-dive</button>
        <button class="topnav-tab ${state.view==='comparison'?'active':''}" data-view="comparison">Cross-country comparison</button>
        <button class="topnav-tab ${state.view==='insights'?'active':''}" data-view="insights">Insights & heat map</button>
        <button class="topnav-tab ${state.view==='analysis'?'active':''}" data-view="analysis">Analysis & process flow</button>
      </div>
    </div>
  `;
}

function renderToolbar() {
  const countries = Object.keys(COUNTRIES);
  if (state.view === 'country') {
    return `
      <div class="toolbar">
        <span class="toolbar-label">Country</span>
        <select id="country-select">
          ${countries.map(c => `<option value="${c}" ${c===state.selectedCountry?'selected':''}>${COUNTRIES[c].flag} ${c}</option>`).join('')}

        <span class="toolbar-label" style="margin-left:12px">Search</span>
        <input type="text" class="search-input" id="search-input" placeholder="Filter questions..." value="${state.searchQuery}">

    `;
  }
  if (state.view === 'comparison') {
    return `
      <div class="toolbar">
        <span class="toolbar-label">Category</span>
        <select id="comp-category-select">
          ${CATEGORIES.map(c => `<option value="${c.id}" ${c.id===state.comparisonCategory?'selected':''}>${c.icon} ${c.title}</option>`).join('')}

function renderCountryView() {
  const c = state.selectedCountry;
  const info = COUNTRIES[c];
  const query = state.searchQuery.toLowerCase();
  
  let html = `
    <div class="country-header">
      <div class="country-flag">${info.flag}</div>
      <div>
        <div class="country-name">${c}</div>
        <div class="country-meta">${info.region} · Regulatory: ${info.regulatory} · EC: ${info.ec}</div>
      </div>
    </div>
    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-card-label">CTA approval</div>
        <div class="summary-card-value" style="color:var(--accent)">${info.ctaTimeline}</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">EC approval</div>
        <div class="summary-card-value" style="color:var(--purple)">${info.ecTimeline}</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">CTAg execution</div>
        <div class="summary-card-value" style="color:var(--accent2)">${info.ctagTimeline}</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">Site activation</div>
        <div class="summary-card-value" style="color:var(--teal)">${info.siteActivation}</div>
      </div>
      <div class="summary-card">
        <div class="summary-card-label">Total start-up</div>
        <div class="summary-card-value" style="color:var(--coral)">${info.totalStartup}</div>
      </div>
    </div>
  `;

  CATEGORIES.forEach(cat => {
    const isExpanded = state.expandedCats[cat.id] !== false; // default open
    let filteredSubs = cat.subcategories.map(sub => {
      const filteredQs = sub.questions.filter(q => {
        if (!query) return true;
        return q.q.toLowerCase().includes(query) || (q.answers[c]||'').toLowerCase().includes(query);
      });
      return { ...sub, questions: filteredQs };
    }).filter(sub => sub.questions.length > 0);

    if (query && filteredSubs.length === 0) return;
    const totalQs = filteredSubs.reduce((sum, s) => sum + s.questions.length, 0);

    html += `
      <div class="category-section">
        <div class="category-header" data-cat="${cat.id}">
          <div class="cat-icon" style="background:${cat.bgColor};color:${cat.color}">${cat.icon}</div>
          <div class="cat-title">${cat.title}</div>
          <div class="cat-count">${totalQs} questions</div>
          <div class="cat-chevron ${isExpanded ? 'open' : ''}">▶</div>
        </div>
        ${isExpanded ? `<div class="qa-list">
          ${filteredSubs.map(sub => `
            <div style="margin-bottom:12px">
              <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:${cat.color};margin-bottom:8px;padding-top:8px;border-top:1px dashed var(--border)">${sub.name}</div>
              ${sub.questions.map(q => {
                const ans = q.answers[c] || 'Data not yet available';
                const tag = getAnswerTag(ans);
                return `
                  <div class="qa-item">
                    <div class="qa-question">${q.q}</div>
                    <div class="qa-answer">
                      ${tag === 'yes' ? '<span class="tag tag-yes">Yes</span>' : ''}
                      ${tag === 'no' ? '<span class="tag tag-no">No</span>' : ''}
                      ${ans}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `).join('')}
        </div>` : ''}
      </div>
    `;
  });

  return html;
}

function renderComparisonView() {
  const cat = CATEGORIES.find(c => c.id === state.comparisonCategory);
  if (!cat) return '';
  const countries = Object.keys(COUNTRIES);
  const query = state.searchQuery.toLowerCase();

  let html = `<div class="comparison-grid"><table class="comp-table"><thead><tr>
    <th>Question</th>
    ${countries.map(c => `<th>${COUNTRIES[c].flag} ${c}</th>`).join('')}
  </tr></thead><tbody>`;

  cat.subcategories.forEach(sub => {
    const filteredQs = sub.questions.filter(q => {
      if (!query) return true;
      if (q.q.toLowerCase().includes(query)) return true;
      return countries.some(c => (q.answers[c]||'').toLowerCase().includes(query));
    });
    if (filteredQs.length === 0) return;

    html += `<tr class="cat-row"><td colspan="${countries.length + 1}">${sub.name}</td></tr>`;
    filteredQs.forEach(q => {
      html += `<tr><td>${q.q}</td>`;
      countries.forEach(c => {
        const ans = q.answers[c] || '—';
        const tag = getAnswerTag(ans);
        let cls = '';
        if (tag === 'yes') cls = 'cell-yes';
        else if (tag === 'no') cls = 'cell-no';
        else if (ans.match(/\d+.*days/i)) cls = 'cell-timeline';
        html += `<td class="${cls}">${ans}</td>`;
      });
      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';
  return html;
}

        <span style="font-size:16px;font-weight:700">${b.country}</span>
        <span style="font-size:11px;font-weight:700;color:${b.sevColor};background:${b.sevBg};padding:3px 10px;border-radius:4px">${b.severity}</span>
      </div>
      <div style="padding:12px 20px">
        ${b.items.map(it => `<div style="padding:6px 0;font-size:13px;color:var(--text);border-bottom:1px solid var(--border)">→ ${it}</div>`).join('')}
      </div>
    </div>`;
  });
  return html;
}

// ====== EVENT BINDING ======

function bindEvents() {
  // Nav tabs
  document.querySelectorAll('.topnav-tab[data-view]').forEach(btn => {
    btn.addEventListener('click', () => setState({ view: btn.dataset.view, searchQuery: '' }));
  });
  // Analysis sub-tabs
  document.querySelectorAll('[data-atab]').forEach(btn => {
    btn.addEventListener('click', () => setState({ analysisTab: btn.dataset.atab }));
  });
  // Country select
  const cs = document.getElementById('country-select');
  if (cs) cs.addEventListener('change', () => setState({ selectedCountry: cs.value }));
  // Comparison category select
  const cc = document.getElementById('comp-category-select');
  if (cc) cc.addEventListener('change', () => setState({ comparisonCategory: cc.value }));
  // Search
  const si = document.getElementById('search-input');
  if (si) si.addEventListener('input', () => {
    state.searchQuery = si.value;
    render();
    // Re-focus search after render
    const newSi = document.getElementById('search-input');
    if (newSi) { newSi.focus(); newSi.selectionStart = newSi.selectionEnd = newSi.value.length; }
  });
  // Category expand/collapse
  document.querySelectorAll('.category-header').forEach(hdr => {
    hdr.addEventListener('click', () => {
      const catId = hdr.dataset.cat;
      const wasExpanded = state.expandedCats[catId] !== false;
      state.expandedCats[catId] = !wasExpanded;
      render();
    });
  });
}

// ====== INIT ======
render();
</script>
